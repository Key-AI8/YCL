<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>影视搜播</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e0e;color:#eee;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:30px}
.top{padding:12px;background:#161616;position:sticky;top:0;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.row{display:flex;gap:8px;margin-bottom:8px}
input,button,select{padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;font-size:15px}
input{flex:1;min-width:0}
button{background:#e50914;color:#fff;border:none;padding:10px 16px;white-space:nowrap;cursor:pointer}
.tabs{display:flex;gap:8px;font-size:13px;color:#aaa}
.tabs span{padding:4px 8px;border-radius:6px;cursor:pointer}
.tabs span.on{background:#e50914;color:#fff}
section{padding:12px}
h2{font-size:16px;margin-bottom:8px;color:#ddd}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#1a1a1a;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#222}
.card .t{padding:6px;font-size:12px;line-height:1.3;height:34px;overflow:hidden}
.list .card{display:flex;gap:10px;padding:8px}
.list .card img{width:90px;height:120px;aspect-ratio:auto;flex-shrink:0}
.list .card .t{font-size:14px;height:auto;padding:4px 6px}
#player{position:sticky;top:0;background:#000;z-index:8}
video{width:100%;max-height:45vh;background:#000}
.eps{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.ep{padding:7px 11px;background:#222;border-radius:6px;font-size:13px;cursor:pointer}
.ep.on{background:#e50914}
.intro{color:#bbb;font-size:13px;line-height:1.6;padding:0 12px 10px}
.msg{padding:14px;color:#888;text-align:center;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <select id="source"></select>
  </div>
  <div class="row">
    <input id="kw" placeholder="输入剧名，如 伍六七" autocomplete="off">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div class="tabs">
    <span id="tabHome" class="on" onclick="switchTab('home')">首页</span>
    <span id="tabSearch" onclick="switchTab('search')">搜索结果</span>
    <span id="tabDetail" onclick="switchTab('detail')">选集</span>
  </div>
</div>

<div id="player" class="hidden">
  <video id="v" controls playsinline autoplay></video>
</div>

<section id="homeSec">
  <h2>精选推荐</h2>
  <div id="home" class="grid"></div>
</section>

<section id="searchSec" class="hidden">
  <h2>搜索结果</h2>
  <div id="searchList" class="grid"></div>
</section>

<section id="detailSec" class="hidden">
  <h2 id="dTitle"></h2>
  <div id="dIntro" class="intro"></div>
  <div id="eps" class="eps"></div>
</section>

<div id="msg" class="msg">加载中…</div>

<script>
const $ = id => document.getElementById(id);
const msg = t => $('msg').textContent = t;
const API = location.origin;  // 同域：Vercel 上前端与 api/ 同域

let currentSource = '4kcz';
let hls = null;

// 图片走代理（解决防盗链/跨域）
const img = u => u ? `${API}/api/img?url=${encodeURIComponent(u)}` : '';

function switchTab(name){
  ['home','search','detail'].forEach(n=>{
    $(n+'Sec').classList.toggle('hidden', n!==name);
    $('tab'+n.charAt(0).toUpperCase()+n.slice(1)).classList.toggle('on', n===name);
  });
}

async function api(path){
  const r = await fetch(API + path, {headers:{'Accept':'application/json'}});
  return await r.json();
}

// 卡片渲染
function card(it, onclick){
  return `<div class="card" onclick="${onclick}">
    <img src="${img(it.cover)}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%22100%22%3E%3Crect width=%2280%22 height=%22100%22 fill=%22%23222%22/%3E%3C/svg%3E'">
    <div class="t">${it.title||''}</div>
  </div>`;
}

// 加载数据源
async function loadSources(){
  try{
    const j = await api('/api/sources');
    $('source').innerHTML = (j.sources||[]).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
    if(j.sources && j.sources[0]) currentSource = j.sources[0].id;
  }catch(e){}
}

// 首页
async function loadHome(){
  msg('加载首页…');
  try{
    const j = await api('/api/home?source='+currentSource);
    const list = (j.items||[]).map(it=>card(it, `openDetail('${encodeURIComponent(it.url)}')`)).join('');
    $('home').innerHTML = list || '<div class="msg">暂无内容</div>';
    msg('');
  }catch(e){ msg('首页加载失败：'+e.message); }
}

// 搜索
async function doSearch(){
  const wd = $('kw').value.trim();
  if(!wd){ msg('请输入剧名'); return; }
  switchTab('search');
  msg('搜索中…');
  try{
    const j = await api('/api/search?source='+currentSource+'&wd='+encodeURIComponent(wd));
    if(!j.items || !j.items.length){
      $('searchList').innerHTML = '<div class="msg">没找到相关结果，换个关键词试试</div>';
      msg(''); return;
    }
    $('searchList').innerHTML = j.items.map(it=>card(it, `openDetail('${encodeURIComponent(it.url)}')`)).join('');
    msg('');
  }catch(e){ msg('搜索失败：'+e.message); }
}

// 详情 + 选集
async function openDetail(enc){
  const url = decodeURIComponent(enc);
  switchTab('detail');
  msg('解析中…');
  try{
    const j = await api('/api/detail?source='+currentSource+'&url='+encodeURIComponent(url));
    const d = j.data || {};
    $('dTitle').textContent = d.title || '未知';
    $('dIntro').textContent = d.intro || '';
    const eps = d.episodes || [];
    $('eps').innerHTML = eps.map((ep,i)=>`<span class="ep ${i===0?'on':''}" onclick="playEp('${encodeURIComponent(ep.url)}',this)">${ep.name||('第'+(i+1)+'集')}</span>`).join('')
      || '<div class="msg">未解析到选集</div>';
    // 若有直链，直接播第一集
    if(d.video_url) playUrl(d.video_url);
    else if(eps[0]) playEp(encodeURIComponent(eps[0].url), $('eps').firstChild);
    msg('');
  }catch(e){ msg('解析失败：'+e.message); }
}

// 播某一集：先请求 detail 拿直链（这里简化为直接拼播放页，由 detail 接口已含 video_url）
async function playEp(enc, el){
  document.querySelectorAll('.ep').forEach(e=>e.classList.remove('on'));
  if(el) el.classList.add('on');
  const url = decodeURIComponent(enc);
  // 该 url 是播放页，需再经 detail 接口抽直链 —— 复用：把播放页当 detail 解析
  try{
    const j = await api('/api/detail?source='+currentSource+'&url='+encodeURIComponent(url));
    if(j.data && j.data.video_url) playUrl(j.data.video_url);
    else msg('未找到播放地址，可能是防盗链或动态加载');
  }catch(e){ msg('播放失败：'+e.message); }
}

function playUrl(url){
  $('player').classList.remove('hidden');
  const v = $('v');
  if(hls){ hls.destroy(); hls = null; }
  if(/\.m3u8/i.test(url)){
    if(v.canPlayType('application/vnd.apple.mpegurl')){ v.src = url; }
    else if(window.Hls && Hls.isSupported()){ hls = new Hls(); hls.loadSource(url); hls.attachMedia(v); }
    else { msg('当前浏览器不支持 m3u8，请换 Safari 或用外部播放器'); return; }
  }else{ v.src = url; }
  v.play().catch(()=>{});
  window.scrollTo({top:0,behavior:'smooth'});
}

// 初始化
loadSources().then(loadHome);
$('source').addEventListener('change', e=>{ currentSource = e.target.value; loadHome(); });
$('kw').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
</script>
</body>
</html>
